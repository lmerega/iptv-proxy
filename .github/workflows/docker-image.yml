name: Test and publish container

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*.*.*", "[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -mod=vendor ./...
      - run: go vet -mod=vendor ./...
      - run: go build -mod=vendor ./...
      - name: Validate standalone Compose example
        run: docker compose --env-file .env.example -f compose.standalone.yaml config --quiet

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.repository == 'lmerega/iptv-proxy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lmerega/iptv-proxy
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
